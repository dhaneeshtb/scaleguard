worker_processes 1;
pid BENCH_DIR/logs/backend.pid;
error_log BENCH_DIR/logs/backend.err;
events { worker_connections 8192; }
http {
  access_log off; sendfile on; tcp_nopush on; keepalive_requests 100000000; open_file_cache max=100;
  server { listen 9200 backlog=4096; root BENCH_DIR/www; location = /small { default_type text/plain; } location = /16k { default_type application/octet-stream; } }
}

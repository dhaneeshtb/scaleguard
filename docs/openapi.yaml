openapi: 3.0.3
info:
  title: ScaleGuard Admin API
  version: "1.0"
  description: |
    Admin API of the ScaleGuard load balancer. See docs/API.md for the narrative guide.

    Append `?scaleguard=true` to every call. It makes sure the request reaches the admin API even when the
    Host header matches a proxied route. Get a token from `POST /signin` and send it as
    `Authorization: <token>` (a `Bearer ` prefix is also accepted).
servers:
  - url: http://localhost:8081
    description: Local
security:
  - token: []
components:
  securitySchemes:
    token:
      type: apiKey
      in: header
      name: Authorization
    oauthClient:
      type: http
      scheme: basic
      description: 'OAuth client authentication: client_id and client_secret (client_secret_basic). client_secret_post (form fields) also works.'
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /oauth2/token, sent to routes that have an app attached
  parameters:
    scaleguard:
      name: scaleguard
      in: query
      required: false
      schema: { type: boolean, default: true }
      description: Force the request to the admin API.
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    configType:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [sourcesystems, targetsystems, hostgroups] }
  responses:
    Forbidden:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooMany:
      description: Admin rate limit exceeded (see Retry-After)
  schemas:
    CloudFunction:
      type: object
      required: [name, code]
      properties:
        id: { type: string, readOnly: true }
        name: { type: string }
        description: { type: string }
        code: { type: string, description: Groovy source; see docs/CLOUD_FUNCTIONS.md }
        enabled: { type: boolean, default: true }
        methods: { type: array, items: { type: string }, description: 'Allowed HTTP methods; empty = any. Others get 405.' }
        timeoutMs: { type: integer, default: 5000 }
        maxRequestBytes: { type: integer, default: 1048576 }
        maxResponseBytes: { type: integer, default: 1048576 }
        maxConcurrent: { type: integer, default: 10 }
        maxMemoryMb: { type: integer, default: 512, description: Allocation budget per run }
        networkEnabled: { type: boolean, default: false }
        allowedHosts: { type: array, items: { type: string }, description: '[http://|https://]host[:port], host may start with *.' }
        allowPrivateNetworks: { type: boolean, default: false }
        maxHttpCalls: { type: integer, default: 5 }
        maxHttpBytes: { type: integer, default: 1048576 }
        secrets: { type: array, items: { type: string }, description: Gateway secret names ctx.secret() may return }
        config: { type: object, additionalProperties: { type: string } }
    Error:
      type: object
      properties: { message: { type: string } }
    SourceSystem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        host: { type: string, example: api.example.com }
        port: { type: string, example: "443" }
        scheme: { type: string, enum: [http, https] }
        basePath: { type: string, example: / }
        target: { type: string, description: groupId of the target system }
        autoProcure: { type: boolean }
        certificateId: { type: string }
        async: { type: boolean }
        asyncEngine: { type: string }
        secappid: { type: string, description: 'Require an OAuth 2.0 access token issued for this app (401 without one)' }
        oauthScopes: { type: string, description: 'Space-separated scopes the token must carry on this route (403 insufficient_scope otherwise)' }
        jwtKeylookup: { type: string }
        headerLookup: { type: string }
        keyLookupMap: { type: object, additionalProperties: { type: array, items: { type: string } } }
        tunnel: { type: boolean }
        rateLimit: { type: integer, description: "Requests/min per client. -1 or absent = default, 0 = unlimited" }
        http2: { type: boolean, default: true, description: "HTTP/2 (ALPN h2 / h2c) for this route" }
        http3: { type: boolean, default: true, description: "HTTP/3 over QUIC (HTTPS routes), advertised with Alt-Svc" }
        ipAllow: { type: string, description: "Only these IPs/CIDRs may use the route (comma-separated)" }
        ipDeny: { type: string, description: "IPs/CIDRs refused on this route (comma-separated)" }
        grpc: { type: boolean, default: true, description: "Proxy gRPC calls end to end over HTTP/2; off = UNIMPLEMENTED" }
    TargetSystem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        groupId: { type: string }
        hostGroupId: { type: string }
        scheme: { type: string, enum: [http, https, tcp] }
        basePath: { type: string }
        lbStrategy: { type: string, enum: [ROUND_ROBIN, LEAST_CONNECTIONS, WEIGHTED, ACTIVE_STANDBY] }
        enableCache: { type: boolean }
        cachedResources: { type: array, items: { type: object, properties: { ttl: { type: integer } } } }
        includeHeaders: { type: object, additionalProperties: { type: string } }
        excludeHeaders: { type: object, additionalProperties: { type: string } }
        connectTimeoutMs: { type: integer, description: "-1 = default (5000)" }
        readTimeoutSeconds: { type: integer, description: "Silence before 504; -1 = default (60)" }
        retries: { type: integer, description: "Connect retries on another backend; -1 = default (1), 0 = off" }
        tlsVerify: { type: boolean, default: false, description: Verify the backend certificate (https targets) }
        tlsServerName: { type: string, description: "SNI / verified name; empty = backend host" }
    HostGroup:
      type: object
      properties:
        id: { type: string }
        groupId: { type: string }
        scheme: { type: string, enum: [http, https] }
        host: { type: string }
        port: { type: string }
        health: { type: string, description: Health-check URL (2xx = healthy) }
        weight: { type: integer, default: 1 }
        type: { type: string, enum: [Active, Standby] }
        priority: { type: integer }
        active: { type: boolean, default: true, description: "false = takes no traffic (nginx down)" }
        maxConns: { type: integer, description: "Max open connections; 0/-1 = unlimited" }
        maxFails: { type: integer, description: "Failures in a row before ejection; -1 = global setting" }
        failTimeoutSeconds: { type: integer, description: "First ejection length; -1 = global setting" }
    QuickMapping:
      type: object
      required: [sourceURL, targets]
      properties:
        sourceURL: { type: string, example: https://app.example.com }
        targets: { type: array, items: { type: string }, example: ["http://10.0.0.5:3000"] }
        name: { type: string }
        tunnel: { type: boolean }
    HealthSettings:
      type: object
      properties:
        enabled: { type: boolean }
        consecutiveFailures: { type: integer, minimum: 1, maximum: 1000, default: 5 }
        baseEjectionSeconds: { type: integer, minimum: 1, maximum: 3600, default: 10 }
        maxEjectionSeconds: { type: integer, maximum: 86400, default: 300 }
        failureStatuses: { type: string, example: "502,503,504" }
        activeIntervalSeconds: { type: integer, readOnly: true }
    BackendState:
      type: object
      properties:
        id: { type: string }
        groupId: { type: string }
        address: { type: string }
        healthUrl: { type: string, nullable: true }
        targets: { type: array, items: { type: string } }
        state: { type: string, enum: [healthy, probing, ejected, down] }
        activeCheck: { type: string, enum: [none, passing, failing] }
        ejectedForSeconds: { type: integer }
        ejections: { type: integer }
        totalEjections: { type: integer }
        consecutiveFailures: { type: integer }
        requests: { type: integer }
        failures: { type: integer }
        lastFailure: { type: string, nullable: true }
        lastFailureAt: { type: integer, format: int64, nullable: true }
        activeConnections: { type: integer }
    BackendsView:
      type: object
      properties:
        settings: { $ref: '#/components/schemas/HealthSettings' }
        summary: { type: object, properties: { hosts: { type: integer }, ejected: { type: integer }, down: { type: integer } } }
        hosts: { type: array, items: { $ref: '#/components/schemas/BackendState' } }
    RateLimitSettings:
      type: object
      properties:
        enabled: { type: boolean }
        perMinute: { type: integer, minimum: 1, maximum: 10000000 }
        burstSeconds: { type: integer, minimum: 1, maximum: 3600 }
        trustedProxies: { type: string, example: "127.0.0.0/8,::1/128" }
        clusterMode: { type: string, enum: [shared, strict, divided, local], description: "How limits apply across cluster nodes (default shared)" }
    RateLimitView:
      type: object
      properties:
        settings: { $ref: '#/components/schemas/RateLimitSettings' }
        stats:
          type: object
          properties:
            allowed: { type: integer }
            rejected: { type: integer }
            trackedClients: { type: integer }
            limitedClients:
              type: array
              items:
                type: object
                properties:
                  client: { type: string }
                  route: { type: string }
                  rejected: { type: integer }
                  limitPerMinute: { type: integer }
                  lastRejectedSecondsAgo: { type: integer }
        routes:
          type: array
          items: { type: object, properties: { id: { type: string }, name: { type: string }, host: { type: string }, rateLimit: { type: integer, nullable: true } } }
    WafPolicy:
      type: object
      properties:
        enabled: { type: boolean, default: false }
        mode: { type: string, enum: [block, anomaly, detect] }
        anomalyThreshold: { type: integer, minimum: 1, default: 5, description: "anomaly mode: block when the summed severity reaches this" }
        paranoiaLevel: { type: integer, minimum: 1, maximum: 4, default: 1 }
        ruleSets: { type: array, items: { type: string }, description: Imported rule sets enabled on this route }
        inspectBody: { type: boolean, default: true }
        maxBodyBytes: { type: integer, default: 65536 }
        rules:
          type: object
          additionalProperties:
            type: object
            properties:
              enabled: { type: boolean }
              action: { type: string, enum: [block, log], nullable: true }
    WafRule:
      type: object
      required: [name, pattern, targets]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        pattern: { type: string, description: Java regex }
        targets: { type: array, items: { type: string, enum: [PATH, QUERY, HEADERS, USER_AGENT, BODY] } }
        action: { type: string, enum: [BLOCK, LOG] }
    WafTest:
      type: object
      properties:
        sourceId: { type: string }
        policy: { $ref: '#/components/schemas/WafPolicy' }
        uri: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        body: { type: string, nullable: true }
    DnsRecord:
      type: object
      required: [name]
      properties:
        name: { type: string, example: api.example.com }
        type: { type: string, enum: [base, a, aaaa, txt, cname, mx, ns, srv, caa, ptr, zone, record] }
        ip: { type: string, description: Record value }
        ttl: { type: integer, minimum: 1, maximum: 604800 }
paths:
  /signin:
    post:
      tags: [Auth]
      summary: Get an admin token
      security: []
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string } } } } }
      responses:
        '200': { description: Token, content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
        '500': { description: Wrong user name or password }
  /config:
    get:
      tags: [Routing]
      summary: All source systems
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { sourcesystems: { type: array, items: { $ref: '#/components/schemas/SourceSystem' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /config/{type}:
    parameters: [{ $ref: '#/components/parameters/configType' }, { $ref: '#/components/parameters/scaleguard' }]
    get:
      tags: [Routing]
      summary: List records of a type
      description: 'Response is `{"<type>": [...]}`.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: { type: array, items: { type: object } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Routing]
      summary: Create (no id) or update (with id); updates are partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf: [{ $ref: '#/components/schemas/SourceSystem' }, { $ref: '#/components/schemas/TargetSystem' }, { $ref: '#/components/schemas/HostGroup' }]
      responses:
        '200': { description: The saved record with its id, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: Validation or storage error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /config/{type}/{id}:
    parameters: [{ $ref: '#/components/parameters/configType' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
    get:
      tags: [Routing]
      summary: One record (same envelope as the list)
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Routing]
      summary: Delete a record
      responses: { '200': { description: Deleted }, '403': { $ref: '#/components/responses/Forbidden' } }
  /config/renewcert/{id}:
    post:
      tags: [Routing]
      summary: Re-issue a route's certificate
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: The source system }, '403': { $ref: '#/components/responses/Forbidden' } }
  /config/quickmapping:
    post:
      tags: [Routing]
      summary: Create source, target and host groups in one call
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuickMapping' } } } }
      responses: { '200': { description: Created records }, '403': { $ref: '#/components/responses/Forbidden' } }
  /backends:
    get:
      tags: [Backend health]
      summary: Health settings and per-backend state
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BackendsView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /backends/settings:
    post:
      tags: [Backend health]
      summary: Update passive health settings (partial)
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HealthSettings' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BackendsView' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /backends/{id}/reset:
    post:
      tags: [Backend health]
      summary: Put an ejected backend back into rotation
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BackendsView' } } } }
        '404': { description: No such host }
  /ratelimit:
    parameters: [{ $ref: '#/components/parameters/scaleguard' }]
    get:
      tags: [Rate limiting]
      summary: Settings, live stats and per-route overrides
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RateLimitView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Rate limiting]
      summary: Update settings (partial)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RateLimitSettings' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RateLimitView' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /ratelimit/access:
    post:
      tags: [Rate limiting]
      summary: Block IPs/networks or exempt them from rate limits
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list, values]
              properties:
                list: { type: string, enum: [blocked, exempt] }
                values: { type: string, description: "IPs / CIDR ranges separated by commas, spaces or new lines" }
                note: { type: string }
                ttlSeconds: { type: integer, minimum: 0, description: "0 = permanent" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RateLimitView' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /ratelimit/access/remove:
    post:
      tags: [Rate limiting]
      summary: Remove an entry from the blocked or exempt list
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [list, value], properties: { list: { type: string, enum: [blocked, exempt] }, value: { type: string } } } } } }
      responses: { '200': { description: OK }, '404': { description: Not on the list } }
  /waf:
    get:
      tags: [Firewall]
      summary: Rules, route policies, stats and recent events
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
  /waf/policy/{id}:
    post:
      tags: [Firewall]
      summary: Save a route's WAF policy
      parameters: [{ name: id, in: path, required: true, description: Source system id, schema: { type: string } }, { $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WafPolicy' } } } }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/BadRequest' } }
  /waf/rules:
    post:
      tags: [Firewall]
      summary: Create or update a custom rule
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WafRule' } } } }
      responses: { '200': { description: OK }, '400': { description: Invalid regular expression } }
  /waf/rules/{id}:
    delete:
      tags: [Firewall]
      summary: Delete a custom rule
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: Deleted } }
  /waf/test:
    post:
      tags: [Firewall]
      summary: Dry-run a request against a route policy or an unsaved policy
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WafTest' } } } }
      responses:
        '200': { description: Verdict, content: { application/json: { schema: { type: object, properties: { blocked: { type: boolean }, matches: { type: array, items: { type: object } } } } } } }
  /waf/rulesets:
    post:
      tags: [Firewall]
      summary: Import or replace a ModSecurity / OWASP CRS rule set
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, files]
              properties:
                name: { type: string, maxLength: 80 }
                files: { type: object, additionalProperties: { type: string }, description: "File name → contents (.conf and .data files)" }
      responses:
        '200': { description: "Import summary: imported, byParanoia, byCategory, skipped, examples, waf" }
        '400': { $ref: '#/components/responses/BadRequest' }
  /waf/rulesets/{name}:
    delete:
      tags: [Firewall]
      summary: Delete an imported rule set
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: Deleted }, '404': { description: Not found } }
  /analytics/summary:
    get:
      tags: [Analytics]
      summary: Dashboard totals, time series and top lists
      parameters:
        - $ref: '#/components/parameters/scaleguard'
        - { name: range, in: query, schema: { type: string, enum: [15m, 1h, 6h, 24h, 7d, 30d], default: 1h } }
        - { name: route, in: query, schema: { type: string }, description: Source system id }
        - { name: node, in: query, schema: { type: string }, description: Cluster node whose log to read }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
  /analytics/logs:
    get:
      tags: [Analytics]
      summary: Access log rows, newest first
      parameters:
        - $ref: '#/components/parameters/scaleguard'
        - { name: range, in: query, schema: { type: string, default: 1h } }
        - { name: route, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: "2xx–5xx or an exact code" }
        - { name: outcome, in: query, schema: { type: string, enum: [proxied, rate_limited, waf_blocked, auth_denied, no_backend, no_route, error, cancelled] } }
        - { name: ip, in: query, schema: { type: string } }
        - { name: method, in: query, schema: { type: string } }
        - { name: trace, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Text in path or query string }
        - { name: limit, in: query, schema: { type: integer, maximum: 500, default: 100 } }
        - { name: before, in: query, schema: { type: integer }, description: "Cursor: the previous page's next value" }
        - { name: node, in: query, schema: { type: string } }
      responses: { '200': { description: "{rows, next}" } }
  /analytics/export:
    get:
      tags: [Analytics]
      summary: Export access log rows (up to 100,000)
      parameters:
        - $ref: '#/components/parameters/scaleguard'
        - { name: format, in: query, schema: { type: string, enum: [csv, ndjson], default: csv } }
        - { name: range, in: query, schema: { type: string } }
        - { name: node, in: query, schema: { type: string } }
      responses: { '200': { description: CSV or NDJSON file } }
  /analytics/query:
    post:
      tags: [Analytics]
      summary: Read-only DuckDB SQL over the access_log view
      parameters: [{ $ref: '#/components/parameters/scaleguard' }, { name: node, in: query, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sql], properties: { sql: { type: string } } } } } }
      responses:
        '200': { description: "{columns, rows, truncated, ms}" }
        '400': { $ref: '#/components/responses/BadRequest' }
  /analytics/replicate:
    get:
      tags: [Analytics]
      summary: "Cluster replication: one origin node's access-log rows after a sequence number (called by peer nodes; the master serves every origin)"
      parameters:
        - { $ref: '#/components/parameters/scaleguard' }
        - { name: origin, in: query, description: "Node whose rows to return (default this node)", schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 50000, default: 20000 } }
      responses:
        '200':
          description: '{"node", "servedBy", "latestSeq", "cursors": {node: seq}, "columns": [...], "rows": [[seq, ts_ms, trace_hi, trace_lo, client_ip, ...], ...]}'
  /analytics/settings:
    get:
      tags: [Analytics]
      summary: Analytics settings and storage status
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
    post:
      tags: [Analytics]
      summary: Update analytics settings
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, retentionDays: { type: integer, minimum: 1, maximum: 3650 } } } } } }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/BadRequest' } }
  /functions:
    get:
      tags: [Cloud functions]
      summary: List functions, gateway secret names (never values), limits and defaults
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: 'OK: {"enabled", "functions": [], "secrets": [], "limits": {}, "defaults": {}}' } }
    post:
      tags: [Cloud functions]
      summary: Create a function (the code is compiled and checked against the sandbox allowlist first)
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CloudFunction' } } } }
      responses: { '200': { description: 'The saved function (replicated to every node)' }, '400': { description: 'Invalid settings or compile / sandbox error ({"message"})' } }
  /functions/check:
    post:
      tags: [Cloud functions]
      summary: Compile-check code without saving
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } } }
      responses: { '200': { description: 'OK: {"ok": true|false, "error": ""}' } }
  /functions/{id}:
    get:
      tags: [Cloud functions]
      summary: A function with the routes that use it and its counters
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK }, '404': { description: Not found } }
    post:
      tags: [Cloud functions]
      summary: Update a function (hot reload; runs in flight finish on the old version)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CloudFunction' } } } }
      responses: { '200': { description: OK }, '400': { description: 'Invalid settings or compile / sandbox error' }, '404': { description: Not found } }
    delete:
      tags: [Cloud functions]
      summary: Delete a function
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK }, '409': { description: Still used by a route } }
  /functions/{id}/test:
    post:
      tags: [Cloud functions]
      summary: Run the saved function with a sample request on this node
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/scaleguard' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { method: { type: string }, path: { type: string }, query: { type: string }, headers: { type: object, additionalProperties: { type: string } }, body: { type: string } } } } } }
      responses: { '200': { description: 'OK: {"status", "headers", "body", "error", "detail", "logs", "ms", "runId"}' } }
  /functions/{id}/runs:
    get:
      tags: [Cloud functions]
      summary: Last 50 runs on this node with their log lines, plus counters
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
  /functions/{id}/attach:
    post:
      tags: [Cloud functions]
      summary: Make the function the target of a route (creates a target system with scheme "function")
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sourceId], properties: { sourceId: { type: string } } } } } }
      responses: { '200': { description: 'OK: {"routes": []}' }, '404': { description: Route or function not found } }
  /functions/secrets/{name}:
    put:
      tags: [Cloud functions]
      summary: Create or replace a gateway secret (write-only, replicated)
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [value], properties: { value: { type: string } } } } } }
      responses: { '200': { description: 'OK: {"secrets": [names]}' }, '400': { description: Invalid name } }
    delete:
      tags: [Cloud functions]
      summary: Delete a gateway secret
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
  /cluster:
    get:
      tags: [Cluster]
      summary: Mode, master, election, members, ledger chains, DR status and sync status
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
  /cluster/resync:
    post:
      tags: [Cluster]
      summary: Reload all configuration on this node (ledger mode also pulls missing entries)
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK }, '400': { description: Not part of a cluster } }
  /cluster/ledger/verify:
    get:
      tags: [Cluster]
      summary: Re-hash every ledger chain on this node
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  tookMs: { type: integer }
                  chains:
                    type: array
                    items: { type: object, properties: { origin: { type: string }, node: { type: string }, entries: { type: integer }, ok: { type: boolean }, problem: { type: string } } }
  /cluster/ledger:
    get:
      tags: [Cluster]
      summary: "Node to node: entries of one ledger chain after a sequence number (without origin: ledger status)"
      parameters:
        - { $ref: '#/components/parameters/scaleguard' }
        - { name: origin, in: query, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 5000, default: 1000 } }
      responses:
        '200': { description: '{"origin", "entries": [{"origin", "seq", "hlc", "node", "tbl", "key", "op", "scopes", "row", "prev", "hash"}]}' }
  /cluster/dr/promote:
    post:
      tags: [Cluster]
      summary: "On a DR standby: promote the DR site to primary (its nodes elect a master in a new, higher term)"
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { force: { type: boolean, description: "Promote even while the primary master is reachable" } } } } } }
      responses:
        '200': { description: '{"ok": true, "message", "nodes": [...]}' }
        '409': { description: Not a DR standby, or the primary master is still reachable (use force) }
  /cluster/gossip:
    post:
      tags: [Cluster]
      summary: "Node to node: membership heartbeat (address, term, role, ledger chain heads, known members); answers with the receiver's"
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
  /cluster/vote:
    post:
      tags: [Cluster]
      summary: "Node to node: request a vote for master ({term, candidate, entries} → {node, term, granted, reason?})"
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
  /cluster/rates:
    post:
      tags: [Cluster]
      summary: "Node to node: per-client rate-limit totals ({node, rows: [[key, consumed, limit, demand]]})"
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
  /dns:
    parameters: [{ $ref: '#/components/parameters/scaleguard' }]
    get:
      tags: [DNS]
      summary: All records grouped by name
      responses: { '200': { description: OK } }
    post:
      tags: [DNS]
      summary: Add a record
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DnsRecord' } } } }
      responses: { '200': { description: OK }, '400': { description: 'Invalid record ({"error": "..."})' } }
  /dns/status:
    get:
      tags: [DNS]
      summary: Desired (cluster-wide) and actual (this node) DNS server state
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: 'OK: {"enabled", "running", "port"}' } }
  /dns/test:
    get:
      tags: [DNS]
      summary: Test one domain, or (no domain) the whole DNS configuration
      parameters: [{ $ref: '#/components/parameters/scaleguard' }, { name: domain, in: query, required: false, schema: { type: string } }]
      responses: { '200': { description: 'One domain: {"domain", "ok", "checks": [{"name", "ok", "detail"}], "instructions": []}. No domain: {"ok", "checks": [], "domains": [<one-domain result>]}' }, '400': { description: 'Invalid domain ({"error": "..."})' } }
  /dns/settings:
    get:
      tags: [DNS]
      summary: Effective DNS server settings and their defaults
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: 'OK: {"settings": {}, "defaults": {}}' } }
    post:
      tags: [DNS]
      summary: Save DNS server settings (replicated; each node restarts its DNS server)
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: { type: string }, example: { dnsRateLimit: '50', dnsProxy: '1.1.1.1,9.9.9.9' } } } } }
      responses: { '200': { description: Saved }, '400': { description: 'Invalid value ({"error": "..."})' }, '500': { description: Saved, but the restart failed on this node } }
  /dns/start:
    post:
      tags: [DNS]
      summary: Start the DNS server on every connected node (saved as dns.enabled)
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK }, '500': { description: 'Could not start on this node ({"error": "..."})' } }
  /dns/stop:
    post:
      tags: [DNS]
      summary: Stop the DNS server on every connected node (saved as dns.enabled)
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
  /dns/stats:
    get:
      tags: [DNS]
      summary: DNS server counters
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
  /dns/cache:
    delete:
      tags: [DNS]
      summary: Clear the forwarding cache
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: Cleared } }
  /dns/{id}:
    delete:
      tags: [DNS]
      summary: Delete a record
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: Deleted } }
  /tunnel:
    parameters: [{ $ref: '#/components/parameters/scaleguard' }]
    get:
      tags: [Tunnels]
      summary: Tunnel DNS records
      responses: { '200': { description: OK } }
    post:
      tags: [Tunnels]
      summary: Expose a service through an SSH tunnel
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, port: { type: integer }, host: { type: string }, baseDNS: { type: string } } } } } }
      responses: { '200': { description: Tunnel record }, '500': { description: Could not configure } }
  /tunnel/{id}:
    delete:
      tags: [Tunnels]
      summary: Remove a tunnelled service
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: Deleted } }
  /certificates:
    parameters: [{ $ref: '#/components/parameters/scaleguard' }]
    get:
      tags: [Certificates]
      summary: All certificates and orders
      responses: { '200': { description: OK } }
    post:
      tags: [Certificates]
      summary: Order a certificate
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [domainNames], properties: { domainNames: { type: array, items: { type: string } }, challengeType: { type: string, enum: [http, dns], default: http } } } } } }
      responses: { '200': { description: Order } }
  /certificates/{id}:
    delete:
      tags: [Certificates]
      summary: Delete a certificate
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: Deleted } }
  /certificates/{id}/verify:
    parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
    get:
      tags: [Certificates]
      summary: Verify the order's challenge
      responses: { '200': { description: 'Status ({"status": "..."})' } }
    post:
      tags: [Certificates]
      summary: Verify the order's challenge
      requestBody: { content: { application/json: { schema: { type: object, properties: { challengeType: { type: string, enum: [http, dns] } } } } } }
      responses: { '200': { description: 'Status ({"status": "..."})' } }
  /certificates/{id}/renew:
    post:
      tags: [Certificates]
      summary: Renew now
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
  /certificates/{id}/download:
    get:
      tags: [Certificates]
      summary: Certificate and key material
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
  /apps:
    parameters: [{ $ref: '#/components/parameters/scaleguard' }]
    get: { tags: [App security], summary: List apps (each with its clients), responses: { '200': { description: OK } } }
    post:
      tags: [App security]
      summary: Create an app (one per API you protect)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string } } } } } }
      responses: { '200': { description: Created } }
  /apps/{id}:
    delete:
      tags: [App security]
      summary: Delete an app and its clients
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: Deleted } }
  /clients:
    parameters: [{ $ref: '#/components/parameters/scaleguard' }]
    get: { tags: [App security], summary: 'List OAuth clients (never includes secrets)', responses: { '200': { description: OK } } }
    post:
      tags: [App security]
      summary: Create an OAuth client. The response is the only place the secret appears
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appid, name]
              properties:
                appid: { type: string }
                name: { type: string }
                description: { type: string }
                clientid: { type: string, description: Generated when omitted }
                clientsecret: { type: string, minLength: 24, description: 'Import an existing secret; generated when omitted' }
                scopes: { type: array, items: { type: string } }
                expiry: { type: integer, format: int64, description: 'Epoch ms when the credentials expire; 0 = never' }
                accessTokenTtlSeconds: { type: integer, description: '60-86400; -1 = gateway default' }
                refreshTokenTtlSeconds: { type: integer, description: '300-31536000; -1 = gateway default' }
                refreshTokens: { type: boolean, default: true }
                enabled: { type: boolean, default: true }
      responses:
        '201':
          description: 'Created: {client, client_secret, credentials}'
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { type: object }
                  client_secret: { type: string }
                  credentials: { type: object, properties: { client_id: { type: string }, client_secret: { type: string }, token_endpoint_path: { type: string }, grant_type: { type: string }, scope: { type: string }, app: { type: string } } }
        '400': { description: Invalid input }
        '404': { description: App not found }
  /clients/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
    post:
      tags: [App security]
      summary: Update a client (name, description, expiry, scopes, token lifetimes, refreshTokens, enabled)
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: Saved client }, '404': { description: Not found } }
    delete:
      tags: [App security]
      summary: Delete a client (its tokens stop working)
      responses: { '200': { description: Deleted } }
  /clients/{id}/secret:
    post:
      tags: [App security]
      summary: Rotate the secret. Old secret and all tokens issued so far stop working
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '201': { description: 'New secret: {client, client_secret, credentials}' } }
  /clients/{id}/revoke:
    post:
      tags: [App security]
      summary: Revoke every access and refresh token issued to the client so far
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: '{"revoked": true}' } }
  /oauth:
    get:
      tags: [App security]
      summary: OAuth settings, signing keys (public info) and endpoint paths
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
  /oauth/settings:
    post:
      tags: [App security]
      summary: Change OAuth settings
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessTokenTtlSeconds: { type: integer, minimum: 60, maximum: 86400 }
                refreshTokenTtlSeconds: { type: integer, minimum: 300, maximum: 31536000 }
                issuer: { type: string, description: 'iss claim; blank = the address the token was requested on' }
                pathPrefix: { type: string, default: /oauth2 }
                legacyHeaders: { type: boolean, description: 'Also accept client_id/client_secret request headers' }
      responses: { '200': { description: Saved }, '400': { description: Out of range } }
  /oauth/keys/rotate:
    post:
      tags: [App security]
      summary: New RS256 signing key (older keys keep verifying for 7 days)
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK } }
  /oauth2/token:
    post:
      tags: [OAuth 2.0]
      summary: 'Token endpoint: client_credentials and refresh_token grants (RFC 6749)'
      security: [{ oauthClient: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials, refresh_token] }
                scope: { type: string, description: Space-separated subset of the allowed scopes }
                refresh_token: { type: string }
                client_id: { type: string, description: client_secret_post only }
                client_secret: { type: string, description: client_secret_post only }
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  scope: { type: string }
                  refresh_token: { type: string }
                  refresh_token_expires_in: { type: integer }
        '400': { description: 'invalid_request, invalid_grant, invalid_scope, unauthorized_client, unsupported_grant_type' }
        '401': { description: invalid_client }
  /oauth2/revoke:
    post:
      tags: [OAuth 2.0]
      summary: Revoke an access or refresh token (RFC 7009)
      security: [{ oauthClient: [] }]
      requestBody: { required: true, content: { application/x-www-form-urlencoded: { schema: { type: object, required: [token], properties: { token: { type: string }, token_type_hint: { type: string } } } } } }
      responses: { '200': { description: Revoked (also for unknown tokens) }, '401': { description: invalid_client } }
  /oauth2/introspect:
    post:
      tags: [OAuth 2.0]
      summary: Token introspection (RFC 7662), for clients of the same app or the admin
      security: [{ oauthClient: [] }, { bearer: [] }]
      requestBody: { required: true, content: { application/x-www-form-urlencoded: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses: { '200': { description: '{"active": false} or {"active": true, client_id, scope, aud, exp, ...}' }, '401': { description: invalid_client } }
  /oauth2/jwks:
    get: { tags: [OAuth 2.0], summary: 'Public signing keys (RFC 7517 JWK Set)', security: [], responses: { '200': { description: OK } } }
  /.well-known/oauth-authorization-server:
    get: { tags: [OAuth 2.0], summary: 'Authorization server metadata (RFC 8414)', security: [], responses: { '200': { description: OK } } }
  /asyncengines:
    parameters: [{ $ref: '#/components/parameters/scaleguard' }]
    get: { tags: [Async], summary: List async engines, responses: { '200': { description: OK } } }
    post:
      tags: [Async]
      summary: Create or update an async engine
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { id: { type: string }, name: { type: string }, type: { type: string }, description: { type: string }, payload: { type: object } } } } } }
      responses: { '200': { description: Saved } }
  /asyncengines/{id}:
    delete:
      tags: [Async]
      summary: Delete an async engine
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: Deleted } }
  /queueevents:
    get:
      tags: [Async]
      summary: Last 200 queue events, newest first
      parameters:
        - { $ref: '#/components/parameters/scaleguard' }
        - { name: status, in: query, schema: { type: string, enum: [pending, dispatching, success, failed, dead] } }
        - { name: engineId, in: query, schema: { type: string } }
      responses: { '200': { description: '{"total", "events": [...]}' } }
  /queueevents/{id}:
    get:
      tags: [Async]
      summary: One queue event
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/scaleguard' }]
      responses: { '200': { description: OK }, '404': { description: Not found } }
  /register/{targetGroupId}/{action}:
    post:
      tags: [Registration]
      summary: Let a backend add (bind) or remove (unbind) itself
      parameters:
        - { name: targetGroupId, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [bind, unbind] } }
        - { $ref: '#/components/parameters/scaleguard' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HostGroup' } } } }
      responses: { '200': { description: OK }, '405': { description: Unknown action } }
  /systems:
    parameters: [{ $ref: '#/components/parameters/scaleguard' }]
    get: { tags: [System], summary: Stored system properties, responses: { '200': { description: OK } } }
  /systems/configure:
    post:
      tags: [System]
      summary: Set the server's own host name (and its certificate)
      parameters: [{ $ref: '#/components/parameters/scaleguard' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [hostName], properties: { hostName: { type: string }, id: { type: string } } } } } }
      responses: { '200': { description: Saved property } }
  /health:
    get: { tags: [Public], summary: Liveness, security: [], responses: { '200': { description: '{"status":"healthy"}' } } }
  /healthz:
    get: { tags: [Public], summary: 'Detailed health (503 when no backend is reachable)', security: [], responses: { '200': { description: OK }, '503': { description: Unhealthy } } }
  /metrics:
    get: { tags: [Public], summary: Prometheus metrics, security: [], responses: { '200': { description: text/plain exposition format } } }
  /stats:
    get: { tags: [Public], summary: Per-route request counts and response times, security: [], responses: { '200': { description: OK } } }
  /info:
    get: { tags: [Public], summary: Version, security: [], responses: { '200': { description: OK } } }

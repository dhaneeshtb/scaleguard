worker_processes WORKERS;
pid BENCH_DIR/logs/nginx.pid;
error_log BENCH_DIR/logs/nginx.err;
events { worker_connections 8192; }
http {
  access_log off; keepalive_requests 100000000;
  upstream b { server 127.0.0.1:9200; keepalive 256; keepalive_requests 100000000; }
  server { listen 8180 backlog=4096; location / { proxy_pass http://b; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering on; } }
}
